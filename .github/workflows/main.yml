name: HEXFORGE Android CI & Installable APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_and_package:
    name: Test & Build Installable APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure Android SDK 36.1 & Accept Licenses
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          sudo mkdir -p "$SDK_ROOT/licenses"
          sudo chown -R "$(id -un):$(id -gn)" "$SDK_ROOT"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found under $SDK_ROOT/cmdline-tools"
            exit 1
          fi

          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null
          set -o pipefail

          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install \
            "platform-tools" \
            "platforms;android-36.1" \
            "build-tools;36.0.0"

      - name: Restore debug.keystore for installable APK signing
        shell: bash
        run: |
          if [ -f "debug.keystore.base64" ]; then
            tr -d '\r\n' < debug.keystore.base64 | base64 -d > debug.keystore
            echo "Restored debug.keystore from debug.keystore.base64"
          elif [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "Generated fallback debug.keystore"
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Run Unit & Robolectric Tests
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Compile & Sign Installable Debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK output
        shell: bash
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK not found at $APK_PATH"
            exit 1
          fi
          ls -lh "$APK_PATH"

      - name: Upload Installable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HEXFORGE-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Unit Test Report (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HEXFORGE-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 7
